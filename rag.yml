openapi: 3.0.3
info:
  title: Chat Bot Backend API
  description: |
    Chat completion API (OpenAI-compatible) for the chat bot backend.
  version: 1.0.0
servers:
  - url: https://chat-bot-backend-b4657f0817.10.3.32.1.nip.io
    description: Chat bot backend server

tags:
  - name: Chat
    description: Chat completion endpoints

paths:
  /v1/chat/completions:
    post:
      tags:
        - Chat
      summary: Create Chat Completion
      description: Generates a model response for the given list of chat messages.
      operationId: createChatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            examples:
              simpleQuestion:
                summary: Simple user question
                value:
                  messages:
                    - role: user
                      content: What is artificial intelligence?
                  max_tokens: 512
                  temperature: 0.7
                  stream: false
      responses:
        '200':
          description: Chat completion generated successfully
          content:
            application/json:
              schema:
                type: object
                description: Chat completion response payload
                additionalProperties: true
        '400':
          description: Bad request - invalid or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Message:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          description: Role of the message author
          enum:
            - system
            - user
            - assistant
          example: user
        content:
          type: string
          description: Content of the message
          example: What is artificial intelligence?

    ChatCompletionRequest:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          description: Conversation messages so far
          minItems: 1
          items:
            $ref: '#/components/schemas/Message'
        max_tokens:
          type: integer
          description: Maximum number of tokens to generate
          minimum: 1
          example: 512
        temperature:
          type: number
          format: float
          description: Sampling temperature; higher values produce more random output
          minimum: 0
          example: 0.7
        stream:
          type: boolean
          description: Whether to stream the response
          default: false
          example: false

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message describing what went wrong
