openapi: 3.0.0
info:
  title: User Savings Prediction API
  description: API to predict next month's savings for users based on historical transaction data
  version: 1.0.0
servers:
  - url: http://67.18.70.164:9476
    description: Power VS Production Server

paths:
  /savings:
    post:
      summary: Predict next month savings
      description: Predicts the probable savings for a user in the next month based on their transaction history
      operationId: predictUserSavings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
              properties:
                user_id:
                  type: integer
                  description: The unique identifier for the user
                  example: 1
      responses:
        '200':
          description: Successful prediction
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user_id:
                    type: integer
                    example: 1
                  predicted_next_month_savings:
                    type: number
                    format: float
                    description: Predicted savings for next month
                    example: 15000.50
                  last_month_savings:
                    type: number
                    format: float
                    description: Actual savings from last month
                    example: 14500.00
                  last_month_balance:
                    type: number
                    format: float
                    description: Account balance at end of last month
                    example: 50000.00
                  last_month_date:
                    type: string
                    description: Date of last month's data
                    example: "2025-02-28"
                  average_savings:
                    type: number
                    format: float
                    description: Average monthly savings
                    example: 14000.00
                  std_savings:
                    type: number
                    format: float
                    description: Standard deviation of savings
                    example: 2000.00
                  n_months:
                    type: integer
                    description: Number of months of historical data
                    example: 12
                  model_filepath:
                    type: string
                    description: Path to the ML model file
                    example: "models/user_1_model.pkl"
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Missing required parameter: user_id"
                  user_id:
                    type: integer
                    example: 1
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Internal server error"
                  user_id:
                    type: integer
                    example: 1

  /health:
    get:
      summary: Health check
      description: Verify the API is running
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  service:
                    type: string
                    example: "User Savings Prediction API"
