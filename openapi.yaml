openapi: 3.0.3
info:
  title: User Savings Prediction API
  description: |
    Flask API for User Savings Prediction.

    This API provides endpoints to:
    - Predict next month's savings for users using Exponential Smoothing
    - Classify savings plans based on user features

    The service uses machine learning models for time series forecasting and classification.
  version: 1.0.0
  contact:
    name: API Support
servers:
  # ─────────────────────────────────────────────────────────────────────────
  # DEPLOYMENT CONFIGURATION — update the URL below before deploying
  #
  # Local development (default):
  #   Leave as-is. Flask binds to 127.0.0.1 by default.
  #
  # Remote server / Linux LPAR:
  #   1. Replace 127.0.0.1 in this file with your server's IP address.
  #   2. In app.py (line 318), change host='127.0.0.1' to your server's IP.
  #   Example: http://192.168.1.100:9476
  # ─────────────────────────────────────────────────────────────────────────
  #- url: http://127.0.0.1:9476
  #  description: Local development server (default)
  #- url: http://192.168.0.107:9476
  - url: http://<YOUR-SERVER-IP>:9476
    description: Remote server / Linux LPAR — replace <YOUR-SERVER-IP> with the actual IP

tags:
  - name: Savings Prediction
    description: Endpoints for predicting user savings
  - name: Classification
    description: Endpoints for savings plan classification
  - name: Health
    description: Health check and API information

paths:
  /:
    get:
      tags:
        - Health
      summary: API Documentation
      description: Returns API documentation with available endpoints and examples
      operationId: getApiDocumentation
      responses:
        '200':
          description: API documentation retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: User Savings Prediction API
                  version:
                    type: string
                    example: 1.0.0
                  endpoints:
                    type: object
                    description: Available API endpoints with descriptions

  /health:
    get:
      tags:
        - Health
      summary: Health Check
      description: Simple health check to verify the API is running
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: User Savings Prediction API

  /savings:
    post:
      tags:
        - Savings Prediction
      summary: Predict Next Month Savings
      description: |
        Predict next month's savings for a specific user using Exponential Smoothing time series model.
        
        The endpoint will:
        - Load an existing trained model if available
        - Train a new model if the user exists but no model is found
        - Return an error if the user doesn't exist in the dataset
      operationId: predictUserSavings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
              properties:
                user_id:
                  type: integer
                  description: User ID to predict savings for
                  example: 6
            examples:
              validRequest:
                summary: Valid prediction request
                value:
                  user_id: 6
      responses:
        '200':
          description: Prediction successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user_id:
                    type: integer
                    example: 6
                  user_details:
                    type: object
                    description: User profile information
                    additionalProperties: true
                  predicted_next_month_savings:
                    type: number
                    format: float
                    description: Predicted savings for next month
                    example: 15000.50
                  last_month_savings:
                    type: number
                    format: float
                    description: Actual savings from last month
                    example: 14500.00
                  last_month_balance:
                    type: number
                    format: float
                    description: Account balance at end of last month
                    example: 125000.00
                  last_month_date:
                    type: string
                    description: Date of last month in YYYY-MM format
                    example: "2025-03"
                  average_savings:
                    type: number
                    format: float
                    description: Average monthly savings over historical period
                    example: 14000.00
                  std_savings:
                    type: number
                    format: float
                    description: Standard deviation of monthly savings
                    example: 2500.00
                  n_months:
                    type: integer
                    description: Number of months of historical data used
                    example: 12
                  model_filepath:
                    type: string
                    description: Path to the trained model file
                    example: "src/models/model_user_6.pkl"
        '400':
          description: Bad request - invalid user_id or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingUserId:
                  summary: Missing user_id parameter
                  value:
                    success: false
                    error: "Missing required parameter: user_id"
                invalidUserId:
                  summary: Invalid user_id type
                  value:
                    success: false
                    error: "user_id must be an integer"
                    user_id: "abc"
                userNotFound:
                  summary: User not found in dataset
                  value:
                    success: false
                    error: "User 999 is not trained. User not found in dataset. Available users: [1, 2, 3, 4, 5, 6]"
                    user_id: 999
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /predict:
    post:
      tags:
        - Classification
      summary: Predict Savings Plan Classification
      description: |
        Predict savings plan classification based on user features using a trained classifier model.

        Each feature is sent by name with a strict datatype. Missing, unknown or wrongly
        typed fields are rejected with a 400 that names the offending fields.
      operationId: predictSavingsPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - current_age
                - retirement_age
                - birth_year
                - birth_month
                - gender
                - city
                - state
                - zipcode
                - per_capita_income_zipcode
                - yearly_income_person
                - total_debt
                - fico_score
              properties:
                current_age:
                  type: integer
                  description: Current age in years
                retirement_age:
                  type: integer
                  description: Planned retirement age in years
                birth_year:
                  type: integer
                  description: Year of birth
                birth_month:
                  type: integer
                  description: Month of birth
                gender:
                  type: string
                  description: Gender
                city:
                  type: string
                  description: City of residence
                state:
                  type: string
                  description: State code
                zipcode:
                  type: string
                  description: Zipcode (send as a string to keep leading zeros)
                per_capita_income_zipcode:
                  type: number
                  description: Per capita income of the zipcode
                yearly_income_person:
                  type: number
                  description: Yearly income of the person
                total_debt:
                  type: number
                  description: Total debt
                fico_score:
                  type: integer
                  description: FICO credit score
                savings_plan:
                  type: string
                  description: Currently assigned savings plan (optional, not used by the model)
            examples:
              validRequest:
                summary: Valid classification request
                value:
                  current_age: 45
                  retirement_age: 65
                  birth_year: 1979
                  birth_month: 6
                  gender: "Male"
                  city: "New York"
                  state: "NY"
                  zipcode: "10001"
                  per_capita_income_zipcode: 75000
                  yearly_income_person: 120000
                  total_debt: 50000
                  fico_score: 720
      responses:
        '200':
          description: Classification successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  prediction:
                    type: array
                    description: Predicted savings plan class
                    items:
                      type: string
                    example: ["Plan A"]
        '400':
          description: Bad request - missing, unknown or wrongly typed fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidFields:
                  summary: Wrongly typed and missing fields
                  value:
                    success: false
                    error: "Missing, unknown or wrongly typed fields: city, current_age"
        '500':
          description: Internal server error or model not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                modelNotLoaded:
                  summary: Model not loaded
                  value:
                    success: false
                    error: "Savings plan classifier model not loaded"

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error message describing what went wrong
        user_id:
          type: integer
          description: User ID if provided in request (optional)
      required:
        - success
        - error

# Made with Bob
