openapi: 3.0.3
info:
  title: Chat Completions API
  description: API for generating chat completions using language models
  version: 1.0.0
  contact:
    name: API Support
servers:
  - url: http://10.48.64.113:43905/v1
    description: Production server

paths:
  /chat/completions:
    post:
      summary: Create chat completion
      description: Creates a completion for the chat message using the specified model
      operationId: createChatCompletion
      tags:
        - Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            examples:
              basic:
                summary: Basic chat completion request
                value:
                  model: "/models/granite-3.3-8b-instruct"
                  messages:
                    - role: "user"
                      content: "How to represent evaluation as a function F"
                  max_tokens: 50
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
              examples:
                success:
                  summary: Successful completion
                  value:
                    id: "chatcmpl-123"
                    object: "chat.completion"
                    created: 1677652288
                    model: "/models/granite-3.3-8b-instruct"
                    choices:
                      - index: 0
                        message:
                          role: "assistant"
                          content: "Evaluation can be represented as a function F that maps inputs to outputs..."
                        finish_reason: "length"
                    usage:
                      prompt_tokens: 15
                      completion_tokens: 50
                      total_tokens: 65
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: ID of the model to use
          example: "/models/granite-3.3-8b-instruct"
        messages:
          type: array
          description: A list of messages comprising the conversation so far
          items:
            $ref: '#/components/schemas/ChatMessage'
          minItems: 1
        max_tokens:
          type: integer
          description: The maximum number of tokens to generate in the chat completion
          minimum: 1
          example: 50
        temperature:
          type: number
          description: What sampling temperature to use, between 0 and 2
          minimum: 0
          maximum: 2
          default: 1
          example: 0.7
        top_p:
          type: number
          description: An alternative to sampling with temperature, called nucleus sampling
          minimum: 0
          maximum: 1
          default: 1
          example: 0.9
        n:
          type: integer
          description: How many chat completion choices to generate for each input message
          minimum: 1
          default: 1
          example: 1
        stream:
          type: boolean
          description: If set, partial message deltas will be sent
          default: false
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: Up to 4 sequences where the API will stop generating further tokens
        presence_penalty:
          type: number
          description: Number between -2.0 and 2.0. Positive values penalize new tokens based on whether they appear in the text so far
          minimum: -2
          maximum: 2
          default: 0
        frequency_penalty:
          type: number
          description: Number between -2.0 and 2.0. Positive values penalize new tokens based on their existing frequency in the text so far
          minimum: -2
          maximum: 2
          default: 0

    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - system
            - user
            - assistant
          description: The role of the messages author
          example: "user"
        content:
          type: string
          description: The contents of the message
          example: "How to represent evaluation as a function F"
        name:
          type: string
          description: An optional name for the participant

    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
          description: A unique identifier for the chat completion
          example: "chatcmpl-123"
        object:
          type: string
          description: The object type, which is always chat.completion
          example: "chat.completion"
        created:
          type: integer
          description: The Unix timestamp (in seconds) of when the chat completion was created
          example: 1677652288
        model:
          type: string
          description: The model used for the chat completion
          example: "/models/granite-3.3-8b-instruct"
        choices:
          type: array
          description: A list of chat completion choices
          items:
            $ref: '#/components/schemas/ChatCompletionChoice'
        usage:
          $ref: '#/components/schemas/Usage'

    ChatCompletionChoice:
      type: object
      properties:
        index:
          type: integer
          description: The index of the choice in the list of choices
          example: 0
        message:
          $ref: '#/components/schemas/ChatMessage'
        finish_reason:
          type: string
          enum:
            - stop
            - length
            - content_filter
          description: The reason the model stopped generating tokens
          example: "length"

    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
          description: Number of tokens in the prompt
          example: 15
        completion_tokens:
          type: integer
          description: Number of tokens in the generated completion
          example: 50
        total_tokens:
          type: integer
          description: Total number of tokens used in the request (prompt + completion)
          example: 65

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              description: A human-readable error message
            type:
              type: string
              description: The type of error
            code:
              type: string
              description: An error code identifying the error type

tags:
  - name: Chat
    description: Chat completion operations

